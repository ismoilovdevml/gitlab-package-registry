services:
  app:
    build: .
    image: ombor:latest
    ports:
      - "${OMBOR_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://ombor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ombor
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -base64 48)}
      APP_URL: ${APP_URL:?set APP_URL in .env, e.g. https://ombor.example.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-1440}
      # Self-signed GitLab: put your CA bundle in ./certs/ca.crt and uncomment the line below.
      # NODE_EXTRA_CA_CERTS: /certs/ca.crt
    # volumes:
    #   - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ombor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ombor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ombor -d ombor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
