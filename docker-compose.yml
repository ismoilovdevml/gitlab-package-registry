services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://glpr:glpr_secret@db:5432/glpr
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: glpr
      POSTGRES_PASSWORD: glpr_secret
      POSTGRES_DB: glpr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glpr"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
