name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright + mock GitLab)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ombor
          POSTGRES_PASSWORD: ombor
          POSTGRES_DB: ombor_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ombor -d ombor_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ombor:ombor@localhost:5432/ombor_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ombor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boots the image against Postgres: schema bootstrap + /api/health must succeed.
      - name: Smoke test image
        run: |
          docker network create ombor
          docker run -d --name db --network ombor -e POSTGRES_USER=ombor -e POSTGRES_PASSWORD=ombor -e POSTGRES_DB=ombor postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U ombor -d ombor && break; sleep 2; done
          docker run -d --name app --network ombor -p 3000:3000 \
            -e DATABASE_URL=postgresql://ombor:ombor@db:5432/ombor \
            -e SESSION_SECRET=ci-smoke-secret-0123456789abcdef0123456789 \
            -e APP_URL=http://localhost:3000 ombor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; docker logs app; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ombor
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
